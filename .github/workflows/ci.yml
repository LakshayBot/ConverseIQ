name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: callpilot
          POSTGRES_USER: callpilot
          POSTGRES_PASSWORD: callpilot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U callpilot
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore dependencies
        run: dotnet restore src/CallPilot.slnx

      - name: Build
        run: dotnet build src/CallPilot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/CallPilot.slnx --no-build --configuration Release
