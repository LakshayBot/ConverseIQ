services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callpilot}
      POSTGRES_USER: ${POSTGRES_USER:-callpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callpilot_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.ai-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=${POSTGRES_DB:-callpilot};
        Username=${POSTGRES_USER:-callpilot};
        Password=${POSTGRES_PASSWORD:-callpilot_dev}
      Jwt__Secret: ${JWT_SECRET:-Change-This-To-A-Random-Secret-Of-At-Least-32-Characters}
      Jwt__Issuer: ${JWT_ISSUER:-CallPilot}
      Jwt__Audience: ${JWT_AUDIENCE:-CallPilot}
      Jwt__AccessTokenExpiryMinutes: "${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}"
      Jwt__RefreshTokenExpiryDays: "${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}"
      Encryption__Key: ${ENCRYPTION_KEY:-YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}
      AiEngine__BaseUrl: http://ai-engine:8001
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - server

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

volumes:
  postgres_data:
  server_uploads:
  ollama_data:
