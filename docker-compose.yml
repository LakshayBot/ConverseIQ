services:
  postgres:
    image: pgvector/pgvector:pg17
    # pull only when the image is missing locally - never re-download on
    # every `up` (this was re-pulling the moving tags on each rebuild)
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callpilot}
      POSTGRES_USER: ${POSTGRES_USER:-callpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callpilot_dev}
    # Port 5432 IS published so external SQL clients (psql, TablePlus,
    # pgAdmin, DBeaver) can reach Postgres from the host on localhost:5432.
    # The credentials are POSTGRES_USER / POSTGRES_PASSWORD from .env.
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.ai-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ai_engine_cache:/home/appuser/.cache
    environment:
      WHISPER_MODEL_SIZE: medium.en
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      NEMOTRON_ENABLED: "${NEMOTRON_ENABLED:-true}"
      NEMOTRON_DEVICE: cpu
      NEMOTRON_RIGHT_CONTEXT: "1"
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      CALLPILOT_SERVER_URL: "http://server:5001"
      # ── LLM enrichment (Groq) ──────────────────────────────────────────
      # These MUST be passed in or the AI engine raises _MissingGroqKey and
      # the page-level fail-open wrapper returns products=[] for every page
      # (no entities, no LLM output).  Interpolated from .env on the host
      # so a fresh `docker compose up` Just Works.
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      ENRICHMENT_MODEL: "${ENRICHMENT_MODEL:-qwen/qwen3.6-27b}"
      ENRICHMENT_MAX_TOKENS: "${ENRICHMENT_MAX_TOKENS:-6144}"
      ENRICHMENT_PAGE_INTERVAL_S: "${ENRICHMENT_PAGE_INTERVAL_S:-60}"
    depends_on:
      postgres:
        condition: service_healthy
      # Don't add `ollama` here - it lives on the `ollama` profile so
      # deployments that don't need it can skip it.  The AI engine's
      # enrichment service is fail-open, so a missing Ollama is logged
      # and skipped rather than failing the upload.

  server:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Database=${POSTGRES_DB:-callpilot};
        Username=${POSTGRES_USER:-callpilot};
        Password=${POSTGRES_PASSWORD:-callpilot_dev}
      Jwt__Secret: ${JWT_SECRET:-Change-This-To-A-Random-Secret-Of-At-Least-32-Characters}
      Jwt__Issuer: ${JWT_ISSUER:-CallPilot}
      Jwt__Audience: ${JWT_AUDIENCE:-CallPilot}
      Jwt__AccessTokenExpiryMinutes: "${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}"
      Jwt__RefreshTokenExpiryDays: "${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}"
      Encryption__Key: ${ENCRYPTION_KEY:-YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}
      AiEngine__BaseUrl: http://ai-engine:8001
      NEMOTRON_ENABLED: "${NEMOTRON_ENABLED:-true}"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ENRICHMENT_BUDGET_MINUTES: "${ENRICHMENT_BUDGET_MINUTES:-10}"
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: src/docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    depends_on:
      - server

  ollama:
    # Pinned to a concrete release instead of `latest`: the moving tag was
    # re-downloaded on every rebuild/restart. Pinned tags are pulled once
    # and reused. Bump this tag deliberately when you want a newer Ollama.
    image: ollama/ollama:0.6.5
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  server_uploads:
  ollama_data:
  ai_engine_cache:
  redis_data:
