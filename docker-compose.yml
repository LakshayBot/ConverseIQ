services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callpilot}
      POSTGRES_USER: ${POSTGRES_USER:-callpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callpilot_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  callpilot-server:
    build:
      context: ../src
      dockerfile: CallPilot.Server.Api/Dockerfile
    ports:
      - "${SERVER_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-callpilot};Username=${POSTGRES_USER:-callpilot};Password=${POSTGRES_PASSWORD:-callpilot_dev}"
      Jwt__Secret: ${JWT_SECRET:-ThisIsADevelopmentSecretKeyThatShouldBeReplacedInProduction!}
      Jwt__Issuer: ${JWT_ISSUER:-CallPilot}
      Jwt__Audience: ${JWT_AUDIENCE:-CallPilot}
      Encryption__Key: ${ENCRYPTION_KEY:-a3vFvaHHBcX1kIB0A1HstGpOXGX4wm88cZNR4vurtiY=}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  callpilot-ai-engine:
    build:
      context: ../callpilot-ai-engine
      dockerfile: Dockerfile
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: 1
      AI_ENGINE_WHISPER_MODEL: ${AI_ENGINE_WHISPER_MODEL:-base}
      AI_ENGINE_DEVICE: ${AI_ENGINE_DEVICE:-cpu}
    depends_on:
      - callpilot-server
    restart: unless-stopped

  callpilot-dashboard:
    build:
      context: ../callpilot-dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - callpilot-server
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - local-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
