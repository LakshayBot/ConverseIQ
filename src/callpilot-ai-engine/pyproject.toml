[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callpilot-ai-engine"
version = "0.1.0"
description = "CallPilot AI Engine - Real-time conversational intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sentence-transformers>=3.0.0",
    "numpy>=2.0.0",
    "soundfile>=0.14.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "gliner>=0.2.0",
    "pyahocorasick>=2.1.0",
    "tavily-python>=0.5.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]
